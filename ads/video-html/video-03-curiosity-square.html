<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Run AI - Curiosity Quiz - Square 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #FAF7F2; }

  .container {
    width: 1080px;
    height: 1080px;
    background: #FAF7F2;
    position: relative;
    overflow: hidden;
    animation: masterLoop 10s infinite;
  }

  @keyframes masterLoop {
    0%, 100% { opacity: 1; }
    96% { opacity: 1; }
    98% { opacity: 0; }
    99% { opacity: 0; }
  }

  /* Score phase */
  .score-phase {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    animation: fadeOutPhase 0.5s ease-in 4.5s forwards;
  }

  @keyframes fadeOutPhase {
    to { opacity: 0; }
  }

  .ring-wrapper {
    position: relative;
    width: 320px;
    height: 320px;
    flex-shrink: 0;
  }

  .ring-bg {
    fill: none;
    stroke: #E8E2D9;
    stroke-width: 14;
  }

  .ring-fill {
    fill: none;
    stroke: #C45B28;
    stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 853.98;
    stroke-dashoffset: 853.98;
    transform: rotate(-90deg);
    transform-origin: center;
    animation: ringFill 2.5s ease-out 0.5s forwards;
  }

  /* r=136, circumference = 2*PI*136 = 853.98; 64% fill => offset = 853.98 * 0.36 = 307.43 */
  @keyframes ringFill {
    to {
      stroke-dashoffset: 307.43;
    }
  }

  .score-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'DM Serif Display', serif;
    color: #1B2A4A;
    font-size: 80px;
    line-height: 1;
  }

  .score-number span {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 32px;
    color: #6B7280;
    font-weight: 600;
  }

  .score-text {
    text-align: center;
    padding: 0 80px;
  }

  .score-question {
    font-family: 'DM Serif Display', serif;
    color: #1B2A4A;
    font-size: 50px;
    line-height: 1.25;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease-out 3s forwards;
  }

  .score-subtext {
    font-family: 'Source Sans 3', sans-serif;
    color: #C45B28;
    font-size: 28px;
    font-weight: 700;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.8s ease-out 3.8s forwards;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* End card */
  .end-card {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1B2A4A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: endCardIn 0.8s ease-out 5.2s forwards, endCardOut 0.6s ease-in 9s forwards;
  }

  @keyframes endCardIn {
    to { opacity: 1; }
  }
  @keyframes endCardOut {
    to { opacity: 0; }
  }

  .wordmark {
    font-family: 'DM Serif Display', serif;
    color: #FAF7F2;
    font-size: 60px;
    letter-spacing: -0.5px;
    margin-bottom: 28px;
  }

  .wordmark em {
    color: #C45B28;
    font-style: normal;
  }

  .end-url {
    font-family: 'Source Sans 3', sans-serif;
    color: #D4A853;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 36px;
    text-align: center;
    padding: 0 60px;
  }

  .cta-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #FAF7F2;
    background: #C45B28;
    border: none;
    padding: 18px 52px;
    border-radius: 9999px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="score-phase">
    <div class="ring-wrapper">
      <svg width="320" height="320" viewBox="0 0 320 320">
        <circle class="ring-bg" cx="160" cy="160" r="136" />
        <circle class="ring-fill" cx="160" cy="160" r="136" />
      </svg>
      <div class="score-number">
        <span id="score-val">0</span><span>/50</span>
      </div>
    </div>
    <div class="score-text">
      <div class="score-question">What is your AI Readiness Score?</div>
      <div class="score-subtext">Take the 2-minute audit.</div>
    </div>
  </div>
  <div class="end-card">
    <div class="wordmark">Run <em>AI</em> Community</div>
    <div class="end-url">Take the Free Audit at runai.community</div>
    <div class="cta-btn">Take the Free Audit</div>
  </div>
</div>
<script>
(function loop() {
  const scoreEl = document.getElementById('score-val');
  const target = 32;
  const duration = 2500;
  const startTime = performance.now() + 500;
  let done = false;

  function animate(now) {
    const elapsed = now - startTime;
    if (elapsed < 0) {
      requestAnimationFrame(animate);
      return;
    }
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    scoreEl.textContent = Math.round(eased * target);
    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  scoreEl.textContent = '0';
  requestAnimationFrame(animate);
  setTimeout(loop, 10000);
})();
</script>
</body>
</html>
