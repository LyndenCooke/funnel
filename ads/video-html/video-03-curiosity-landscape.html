<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Run AI - Curiosity Quiz - Landscape 16:9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #FAF7F2; }

  .container {
    width: 1280px;
    height: 720px;
    background: #FAF7F2;
    position: relative;
    overflow: hidden;
    animation: masterLoop 10s infinite;
  }

  @keyframes masterLoop {
    0%, 100% { opacity: 1; }
    96% { opacity: 1; }
    98% { opacity: 0; }
    99% { opacity: 0; }
  }

  /* Score phase */
  .score-phase {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    animation: fadeOutPhase 0.5s ease-in 4.5s forwards;
  }

  @keyframes fadeOutPhase {
    to { opacity: 0; }
  }

  .ring-wrapper {
    position: relative;
    width: 280px;
    height: 280px;
    flex-shrink: 0;
  }

  .ring-bg {
    fill: none;
    stroke: #E8E2D9;
    stroke-width: 12;
  }

  .ring-fill {
    fill: none;
    stroke: #C45B28;
    stroke-width: 12;
    stroke-linecap: round;
    /* Circle circumference: 2 * PI * 120 = 753.98 */
    stroke-dasharray: 753.98;
    stroke-dashoffset: 753.98;
    transform: rotate(-90deg);
    transform-origin: center;
    animation: ringFill 2.5s ease-out 0.5s forwards;
  }

  @keyframes ringFill {
    to {
      /* 32/50 = 64%, so offset = 753.98 * (1 - 0.64) = 271.43 */
      stroke-dashoffset: 271.43;
    }
  }

  .score-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'DM Serif Display', serif;
    color: #1B2A4A;
    font-size: 72px;
    line-height: 1;
  }

  .score-number span {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 28px;
    color: #6B7280;
    font-weight: 600;
  }

  .score-text {
    max-width: 480px;
  }

  .score-question {
    font-family: 'DM Serif Display', serif;
    color: #1B2A4A;
    font-size: 46px;
    line-height: 1.25;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease-out 3s forwards;
  }

  .score-subtext {
    font-family: 'Source Sans 3', sans-serif;
    color: #C45B28;
    font-size: 26px;
    font-weight: 700;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.8s ease-out 3.8s forwards;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* End card */
  .end-card {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1B2A4A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: endCardIn 0.8s ease-out 5.2s forwards, endCardOut 0.6s ease-in 9s forwards;
  }

  @keyframes endCardIn {
    to { opacity: 1; }
  }
  @keyframes endCardOut {
    to { opacity: 0; }
  }

  .wordmark {
    font-family: 'DM Serif Display', serif;
    color: #FAF7F2;
    font-size: 64px;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
  }

  .wordmark em {
    color: #C45B28;
    font-style: normal;
  }

  .end-url {
    font-family: 'Source Sans 3', sans-serif;
    color: #D4A853;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 32px;
  }

  .cta-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #FAF7F2;
    background: #C45B28;
    border: none;
    padding: 16px 48px;
    border-radius: 9999px;
    letter-spacing: 0.5px;
  }

  /* Gold decorative dot */
  .gold-dot {
    position: absolute;
    bottom: 40px;
    right: 60px;
    width: 12px;
    height: 12px;
    background: #D4A853;
    border-radius: 50%;
    opacity: 0;
    animation: fadeUp 0.5s ease-out 1s forwards, fadeOutPhase 0.5s ease-in 4.5s forwards;
  }
</style>
</head>
<body>
<div class="container">
  <div class="score-phase">
    <div class="ring-wrapper">
      <svg width="280" height="280" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="120" />
        <circle class="ring-fill" cx="140" cy="140" r="120" />
      </svg>
      <div class="score-number">
        <span id="score-val">0</span><span>/50</span>
      </div>
    </div>
    <div class="score-text">
      <div class="score-question">What is your AI Readiness Score?</div>
      <div class="score-subtext">Take the 2-minute audit.</div>
    </div>
  </div>
  <div class="gold-dot"></div>
  <div class="end-card">
    <div class="wordmark">Run <em>AI</em> Community</div>
    <div class="end-url">Take the Free Audit at runai.community</div>
    <div class="cta-btn">Take the Free Audit</div>
  </div>
</div>
<script>
(function loop() {
  const scoreEl = document.getElementById('score-val');
  const target = 32;
  const duration = 2500;
  const startTime = performance.now() + 500; // 0.5s delay matching CSS
  let done = false;

  function animate(now) {
    const elapsed = now - startTime;
    if (elapsed < 0) {
      requestAnimationFrame(animate);
      return;
    }
    const progress = Math.min(elapsed / duration, 1);
    // Ease-out curve
    const eased = 1 - Math.pow(1 - progress, 3);
    scoreEl.textContent = Math.round(eased * target);
    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  scoreEl.textContent = '0';
  requestAnimationFrame(animate);
  setTimeout(loop, 10000);
})();
</script>
</body>
</html>
