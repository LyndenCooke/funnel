<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Run AI - Pain Point - Square 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #1B2A4A; }

  .container {
    width: 1080px;
    height: 1080px;
    background: #1B2A4A;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Subtle decorative element - thin gold line */
  .container::before {
    content: '';
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: #D4A853;
    animation: lineGrow 0.8s ease-out 0.3s forwards, lineOut 0.5s ease-in 5.5s forwards;
  }

  @keyframes lineGrow {
    to { height: 360px; }
  }
  @keyframes lineOut {
    to { height: 0; opacity: 0; }
  }

  .text-block {
    padding-left: 110px;
    padding-right: 80px;
    width: 100%;
  }

  .line {
    font-family: 'DM Serif Display', serif;
    color: #FAF7F2;
    font-size: 56px;
    line-height: 1.3;
    opacity: 0;
    transform: translateY(30px);
    margin-bottom: 16px;
  }

  .line-1 {
    animation: fadeUp 0.8s ease-out 0.5s forwards, fadeOutLine 0.5s ease-in 5.5s forwards;
  }
  .line-2 {
    animation: fadeUp 0.8s ease-out 2s forwards, fadeOutLine 0.5s ease-in 5.5s forwards;
  }
  .line-3 {
    color: #C45B28;
    animation: fadeUp 0.8s ease-out 4s forwards, fadeOutLine 0.5s ease-in 5.5s forwards;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes fadeOutLine {
    to {
      opacity: 0;
      transform: translateY(-15px);
    }
  }

  /* End card */
  .end-card {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: endCardIn 0.8s ease-out 6.2s forwards, endCardOut 0.6s ease-in 9s forwards;
  }

  @keyframes endCardIn {
    to { opacity: 1; }
  }
  @keyframes endCardOut {
    to { opacity: 0; }
  }

  .wordmark {
    font-family: 'DM Serif Display', serif;
    color: #FAF7F2;
    font-size: 60px;
    letter-spacing: -0.5px;
    margin-bottom: 28px;
  }

  .wordmark span {
    color: #C45B28;
  }

  .end-url {
    font-family: 'Source Sans 3', sans-serif;
    color: #D4A853;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }

  .cta-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #FAF7F2;
    background: #C45B28;
    border: none;
    padding: 18px 52px;
    border-radius: 9999px;
    letter-spacing: 0.5px;
  }

  /* Master animation loop */
  .container {
    animation: masterLoop 10s infinite;
  }
  @keyframes masterLoop {
    0%, 100% { opacity: 1; }
    96% { opacity: 1; }
    98% { opacity: 0; }
    99% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="text-block">
    <div class="line line-1">You spent Sunday afternoon planning.</div>
    <div class="line line-2">AI could have done it in minutes.</div>
    <div class="line line-3">But nobody showed you how.</div>
  </div>
  <div class="end-card">
    <div class="wordmark">Run <span>AI</span> Community</div>
    <div class="end-url">Join Free at skool.com/run-ai</div>
    <div class="cta-btn">Join the Community</div>
  </div>
</div>
</body>
</html>
