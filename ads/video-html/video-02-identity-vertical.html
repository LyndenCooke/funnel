<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Run AI - Identity - Vertical 9:16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #FAF7F2; }

  .container {
    width: 1080px;
    height: 1920px;
    background: #FAF7F2;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: masterLoop 10s infinite;
  }

  @keyframes masterLoop {
    0%, 100% { opacity: 1; }
    96% { opacity: 1; }
    98% { opacity: 0; }
    99% { opacity: 0; }
  }

  .text-block {
    padding: 0 80px;
    width: 100%;
  }

  .typewriter-line {
    font-family: 'DM Serif Display', serif;
    color: #1B2A4A;
    font-size: 56px;
    line-height: 1.35;
    min-height: 320px;
    position: relative;
  }

  .typewriter-line .cursor {
    display: inline-block;
    width: 3px;
    height: 60px;
    background: #C45B28;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.6s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .support-line {
    font-family: 'Source Sans 3', sans-serif;
    color: #1B2A4A;
    font-size: 34px;
    font-weight: 600;
    line-height: 1.5;
    margin-top: 48px;
    opacity: 0;
    transform: translateY(16px);
  }

  .support-line.visible {
    animation: fadeUp 0.8s ease-out forwards;
  }

  .support-line em {
    color: #C45B28;
    font-style: normal;
    font-weight: 700;
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Decorative terracotta bar at top */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #C45B28;
    transform: scaleX(0);
    transform-origin: left;
    animation: barGrow 1s ease-out 0.2s forwards, fadeOutAll 0.5s ease-in 5.5s forwards;
  }

  @keyframes barGrow {
    to { transform: scaleX(1); }
  }

  .text-phase {
    animation: fadeOutAll 0.5s ease-in 5.5s forwards;
  }

  @keyframes fadeOutAll {
    to { opacity: 0; }
  }

  /* End card */
  .end-card {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1B2A4A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: endCardIn 0.8s ease-out 6.2s forwards, endCardOut 0.6s ease-in 9s forwards;
  }

  @keyframes endCardIn {
    to { opacity: 1; }
  }
  @keyframes endCardOut {
    to { opacity: 0; }
  }

  .wordmark {
    font-family: 'DM Serif Display', serif;
    color: #FAF7F2;
    font-size: 64px;
    letter-spacing: -0.5px;
    margin-bottom: 32px;
  }

  .wordmark span {
    color: #C45B28;
  }

  .end-url {
    font-family: 'Source Sans 3', sans-serif;
    color: #D4A853;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 40px;
    text-align: center;
    padding: 0 60px;
  }

  .cta-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #FAF7F2;
    background: #C45B28;
    border: none;
    padding: 20px 56px;
    border-radius: 9999px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar"></div>
  <div class="text-block text-phase">
    <div class="typewriter-line" id="typewriter">
      <span id="typed-text"></span><span class="cursor" id="cursor"></span>
    </div>
    <div class="support-line" id="support">
      You are not behind. <em>You just need the right guide.</em>
    </div>
  </div>
  <div class="end-card">
    <div class="wordmark">Run <span>AI</span> Community</div>
    <div class="end-url">Join Free at skool.com/run-ai</div>
    <div class="cta-btn">Join the Community</div>
  </div>
</div>
<script>
(function loop() {
  const text = "For teachers who know AI matters but have no idea where to start.";
  const typedEl = document.getElementById('typed-text');
  const supportEl = document.getElementById('support');
  const cursorEl = document.getElementById('cursor');
  let i = 0;

  typedEl.textContent = '';
  supportEl.classList.remove('visible');
  cursorEl.style.display = 'inline-block';

  function type() {
    if (i < text.length) {
      typedEl.textContent += text[i];
      i++;
      setTimeout(type, 40 + Math.random() * 20);
    } else {
      setTimeout(() => { cursorEl.style.display = 'none'; }, 500);
      setTimeout(() => {
        supportEl.classList.add('visible');
      }, 700);
    }
  }

  setTimeout(type, 300);
  setTimeout(loop, 10000);
})();
</script>
</body>
</html>
