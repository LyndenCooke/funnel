<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run AI Ad — Social Proof (Landscape)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; }

    .ad {
      width: 1200px;
      height: 627px;
      background-color: #1B2A4A;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
    }

    /* Decorative SVG pattern */
    .ad__decoration {
      position: absolute;
      top: 50%;
      right: -40px;
      transform: translateY(-50%);
      width: 340px;
      height: 340px;
      opacity: 0.08;
    }

    .ad__decoration-corner {
      position: absolute;
      top: -30px;
      left: -30px;
      width: 140px;
      height: 140px;
      opacity: 0.1;
    }

    /* Terracotta accent line */
    .ad__accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: #C45B28;
    }

    .ad__stat {
      font-family: 'DM Serif Display', serif;
      font-size: 120px;
      line-height: 1;
      color: #D4A853;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .ad__stat-text {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 30px;
      line-height: 1.4;
      color: #FAF7F2;
      max-width: 600px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .ad__supporting {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #FAF7F2;
      opacity: 0.55;
      max-width: 560px;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .ad__cta {
      display: inline-block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #FAF7F2;
      background-color: #C45B28;
      padding: 14px 40px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .ad__wordmark {
      position: absolute;
      bottom: 36px;
      left: 80px;
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: #FAF7F2;
      opacity: 0.7;
      z-index: 1;
    }

    .ad__wordmark span {
      color: #C45B28;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="ad__accent-line"></div>

    <!-- Right-side decorative circles -->
    <svg class="ad__decoration" viewBox="0 0 340 340" fill="none" aria-hidden="true">
      <circle cx="170" cy="170" r="160" stroke="#D4A853" stroke-width="1" />
      <circle cx="170" cy="170" r="120" stroke="#FAF7F2" stroke-width="0.4" />
      <circle cx="170" cy="170" r="80" stroke="#D4A853" stroke-width="0.5" />
      <circle cx="170" cy="170" r="40" stroke="#FAF7F2" stroke-width="0.4" />
      <line x1="10" y1="170" x2="330" y2="170" stroke="#D4A853" stroke-width="0.3" />
      <line x1="170" y1="10" x2="170" y2="330" stroke="#D4A853" stroke-width="0.3" />
    </svg>

    <!-- Top-left corner accent -->
    <svg class="ad__decoration-corner" viewBox="0 0 140 140" fill="none" aria-hidden="true">
      <circle cx="70" cy="70" r="60" stroke="#C45B28" stroke-width="0.8" />
      <circle cx="70" cy="70" r="35" stroke="#C45B28" stroke-width="0.5" />
    </svg>

    <div class="ad__stat">100+</div>
    <p class="ad__stat-text">teachers saving 10+ hours a week with AI</p>
    <p class="ad__supporting">Not technical. Not experts. Just classroom teachers with the right guide.</p>
    <div>
      <span class="ad__cta">Join Free</span>
    </div>

    <div class="ad__wordmark">Run <span>AI</span> Community</div>
  </div>
</body>
</html>
