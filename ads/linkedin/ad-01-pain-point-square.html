<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run AI Ad — Pain Point (Square)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; }

    .ad {
      width: 1080px;
      height: 1080px;
      background-color: #1B2A4A;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 72px;
    }

    /* Decorative SVG pattern */
    .ad__decoration {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      opacity: 0.1;
    }

    .ad__decoration-btm {
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 260px;
      height: 260px;
      opacity: 0.07;
    }

    /* Terracotta accent line */
    .ad__accent-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background-color: #C45B28;
    }

    .ad__hook {
      font-family: 'DM Serif Display', serif;
      font-size: 68px;
      line-height: 1.15;
      color: #FAF7F2;
      max-width: 860px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    .ad__subtext {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 26px;
      line-height: 1.5;
      color: #FAF7F2;
      opacity: 0.8;
      max-width: 700px;
      margin-bottom: 56px;
      position: relative;
      z-index: 1;
    }

    .ad__cta {
      display: inline-block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #FAF7F2;
      background-color: #C45B28;
      padding: 18px 52px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .ad__wordmark {
      position: absolute;
      bottom: 44px;
      left: 72px;
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: #FAF7F2;
      opacity: 0.7;
      z-index: 1;
    }

    .ad__wordmark span {
      color: #C45B28;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="ad__accent-line"></div>

    <!-- Top-right decorative circles -->
    <svg class="ad__decoration" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <circle cx="200" cy="200" r="180" stroke="#C45B28" stroke-width="1" />
      <circle cx="200" cy="200" r="140" stroke="#FAF7F2" stroke-width="0.5" />
      <circle cx="200" cy="200" r="100" stroke="#C45B28" stroke-width="0.5" />
      <circle cx="200" cy="200" r="60" stroke="#FAF7F2" stroke-width="0.5" />
      <line x1="20" y1="200" x2="380" y2="200" stroke="#C45B28" stroke-width="0.4" />
      <line x1="200" y1="20" x2="200" y2="380" stroke="#C45B28" stroke-width="0.4" />
    </svg>

    <!-- Bottom-left decorative circle -->
    <svg class="ad__decoration-btm" viewBox="0 0 200 200" fill="none" aria-hidden="true">
      <circle cx="100" cy="100" r="90" stroke="#C45B28" stroke-width="1" />
      <circle cx="100" cy="100" r="60" stroke="#FAF7F2" stroke-width="0.5" />
      <circle cx="100" cy="100" r="30" stroke="#C45B28" stroke-width="0.5" />
    </svg>

    <h1 class="ad__hook">You spent another Sunday afternoon on planning.</h1>
    <p class="ad__subtext">AI could have drafted that in minutes. But nobody showed you how.</p>
    <div>
      <span class="ad__cta">Join Free</span>
    </div>

    <div class="ad__wordmark">Run <span>AI</span> Community</div>
  </div>
</body>
</html>
