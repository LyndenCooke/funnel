<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run AI Ad — Identity (Landscape)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; }

    .ad {
      width: 1200px;
      height: 627px;
      background-color: #FAF7F2;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
    }

    /* Decorative elements */
    .ad__decoration {
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 320px;
      height: 320px;
      opacity: 0.08;
    }

    .ad__accent-dot {
      position: absolute;
      top: 60px;
      right: 80px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #C45B28;
    }

    /* Terracotta accent line on left */
    .ad__accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background-color: #C45B28;
    }

    .ad__hook {
      font-family: 'DM Serif Display', serif;
      font-size: 48px;
      line-height: 1.2;
      color: #1B2A4A;
      max-width: 820px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .ad__subtext {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 21px;
      line-height: 1.5;
      color: #1B2A4A;
      opacity: 0.65;
      max-width: 560px;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    .ad__cta {
      display: inline-block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #FAF7F2;
      background-color: #C45B28;
      padding: 14px 40px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .ad__wordmark {
      position: absolute;
      bottom: 36px;
      left: 80px;
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: #1B2A4A;
      opacity: 0.6;
      z-index: 1;
    }

    .ad__wordmark span {
      color: #C45B28;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="ad__accent-bar"></div>
    <div class="ad__accent-dot"></div>

    <!-- Bottom-right decorative circles -->
    <svg class="ad__decoration" viewBox="0 0 320 320" fill="none" aria-hidden="true">
      <circle cx="160" cy="160" r="150" stroke="#1B2A4A" stroke-width="1" />
      <circle cx="160" cy="160" r="110" stroke="#C45B28" stroke-width="0.6" />
      <circle cx="160" cy="160" r="70" stroke="#1B2A4A" stroke-width="0.5" />
      <line x1="10" y1="160" x2="310" y2="160" stroke="#C45B28" stroke-width="0.3" />
      <line x1="160" y1="10" x2="160" y2="310" stroke="#1B2A4A" stroke-width="0.3" />
    </svg>

    <h1 class="ad__hook">For teachers who know AI matters but have no idea where to start.</h1>
    <p class="ad__subtext">A free community of teachers learning AI together.</p>
    <div>
      <span class="ad__cta">Join Free</span>
    </div>

    <div class="ad__wordmark">Run <span>AI</span> Community</div>
  </div>
</body>
</html>
