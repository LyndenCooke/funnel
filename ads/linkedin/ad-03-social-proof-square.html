<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run AI Ad — Social Proof (Square)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; }

    .ad {
      width: 1080px;
      height: 1080px;
      background-color: #1B2A4A;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 72px;
    }

    /* Decorative SVG pattern */
    .ad__decoration {
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 400px;
      height: 400px;
      opacity: 0.07;
    }

    .ad__decoration-corner {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 180px;
      height: 180px;
      opacity: 0.09;
    }

    /* Terracotta accent line */
    .ad__accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background-color: #C45B28;
    }

    .ad__stat {
      font-family: 'DM Serif Display', serif;
      font-size: 160px;
      line-height: 1;
      color: #D4A853;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .ad__stat-text {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 36px;
      line-height: 1.4;
      color: #FAF7F2;
      max-width: 700px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .ad__supporting {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 22px;
      line-height: 1.5;
      color: #FAF7F2;
      opacity: 0.55;
      max-width: 640px;
      margin-bottom: 52px;
      position: relative;
      z-index: 1;
    }

    .ad__cta {
      display: inline-block;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #FAF7F2;
      background-color: #C45B28;
      padding: 18px 52px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 1;
    }

    .ad__wordmark {
      position: absolute;
      bottom: 44px;
      left: 72px;
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: #FAF7F2;
      opacity: 0.7;
      z-index: 1;
    }

    .ad__wordmark span {
      color: #C45B28;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="ad__accent-line"></div>

    <!-- Bottom-right decorative circles -->
    <svg class="ad__decoration" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <circle cx="200" cy="200" r="180" stroke="#D4A853" stroke-width="1" />
      <circle cx="200" cy="200" r="140" stroke="#FAF7F2" stroke-width="0.4" />
      <circle cx="200" cy="200" r="100" stroke="#D4A853" stroke-width="0.5" />
      <circle cx="200" cy="200" r="60" stroke="#FAF7F2" stroke-width="0.4" />
      <line x1="20" y1="200" x2="380" y2="200" stroke="#D4A853" stroke-width="0.3" />
      <line x1="200" y1="20" x2="200" y2="380" stroke="#D4A853" stroke-width="0.3" />
    </svg>

    <!-- Top-left corner accent -->
    <svg class="ad__decoration-corner" viewBox="0 0 180 180" fill="none" aria-hidden="true">
      <circle cx="90" cy="90" r="80" stroke="#C45B28" stroke-width="0.8" />
      <circle cx="90" cy="90" r="50" stroke="#C45B28" stroke-width="0.5" />
      <circle cx="90" cy="90" r="20" stroke="#C45B28" stroke-width="0.4" />
    </svg>

    <div class="ad__stat">100+</div>
    <p class="ad__stat-text">teachers saving 10+ hours a week with AI</p>
    <p class="ad__supporting">Not technical. Not experts. Just classroom teachers with the right guide.</p>
    <div>
      <span class="ad__cta">Join Free</span>
    </div>

    <div class="ad__wordmark">Run <span>AI</span> Community</div>
  </div>
</body>
</html>
